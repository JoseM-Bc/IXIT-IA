<!DOCTYPE html>
<html lang="es">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="ixitianuevoSolo.png">
    <title>Iniciar Sesión</title>    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>Iniciar Sesión</h1>
        <form id="loginForm" action="../php/login.php" method="POST">        
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
        <div class="links">
            <a href="register.html">Registrarse</a>
            <a href="forgot.html">¿Olvidaste tu contraseña?</a>                
        </div>                
        <button onclick="window.location.href='../index.html'" class="btn">Cancelar</button>
    </div>
    <script src="scripts.js"></script>
    <script>
        // Mostrar mensaje después de logout
        if (new URLSearchParams(window.location.search).has('logout')) {
            alert('Has cerrado sesión correctamente');
            // Limpiar la URL
            history.replaceState({}, '', window.location.pathname);
        }
        </script>
        <script>
            // Mostrar mensaje de error si existe
            if (new URLSearchParams(window.location.search).has('error')) {
                // Crear elemento de mensaje
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = 'Error, correo o contraseña incorrectas';
                errorDiv.style.color = 'red';
                errorDiv.style.marginTop = '15px';
                errorDiv.style.textAlign = 'center';                
                // Insertar después del formulario
                const form = document.getElementById('loginForm');
                form.parentNode.insertBefore(errorDiv, form.nextSibling);                
                // Limpiar parámetro de URL
                history.replaceState({}, '', window.location.pathname);
            }
            </script>
</body>
</html>
